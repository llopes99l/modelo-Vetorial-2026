<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca Vetorial</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07080f;
      --surface:     rgba(255,255,255,0.04);
      --surface-hov: rgba(255,255,255,0.07);
      --border:      rgba(255,255,255,0.08);
      --border-hov:  rgba(255,255,255,0.16);
      --accent1:     #7c6fff;
      --accent2:     #4facfe;
      --text:        #eceeff;
      --muted:       #7a7f9a;
      --mark-bg:     rgba(124,111,255,0.28);
      --mark-text:   #c4bbff;
      --radius-lg:   16px;
      --radius-md:   10px;
      --radius-sm:   6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 80px;
    }

    /* ── Header ── */
    .hero {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 56px 0 40px;
    }
    .hero-icon {
      font-size: 2.4rem;
      margin-bottom: 16px;
      display: block;
    }
    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .hero p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 8px;
      letter-spacing: .04em;
    }

    /* ── Search card ── */
    .search-card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .collection-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .collection-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      white-space: nowrap;
    }
    .collection-select-wrap {
      position: relative;
      flex: 1;
    }
    .collection-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 0.8rem;
    }
    select {
      width: 100%;
      appearance: none;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.88rem;
      padding: 8px 32px 8px 12px;
      outline: none;
      cursor: pointer;
      transition: border-color .2s;
    }
    select:focus { border-color: var(--accent1); }

    .search-row {
      display: flex;
      gap: 10px;
    }
    .input-wrap {
      flex: 1;
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 1rem;
      padding: 12px 14px 12px 42px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent1);
      box-shadow: 0 0 0 3px rgba(124,111,255,.15);
    }
    input[type="text"]::placeholder { color: var(--muted); }

    .btn-search {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 26px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }
    .btn-search:hover   { opacity: .88; }
    .btn-search:active  { transform: scale(.97); }
    .btn-search:disabled { opacity: .4; cursor: not-allowed; }

    .actions-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .btn-reindex {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.78rem;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-reindex:hover { border-color: var(--border-hov); color: var(--text); }
    .btn-reindex:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Results area ── */
    .results-area {
      width: 100%;
      max-width: 720px;
      margin-top: 20px;
    }

    .results-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      gap: 16px;
    }
    .results-meta span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border-hov); }

    /* Result card */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
      align-items: start;
      cursor: default;
      transition: background .2s, border-color .2s, transform .15s;
      animation: slideUp .3s ease both;
    }
    .result-card:hover {
      background: var(--surface-hov);
      border-color: var(--border-hov);
      transform: translateY(-1px);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .rank-col { display: flex; flex-direction: column; align-items: center; padding-top: 2px; gap: 8px; }
    .rank-num {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1;
    }
    .rank-1 { color: #fbbf24; }
    .rank-2 { color: #9ca3af; }
    .rank-3 { color: #c47c3f; }
    .rank-n { color: var(--muted); font-size: 0.9rem; }

    .doc-col { overflow: hidden; }

    .doc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .doc-name {
      font-size: 0.97rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .score-badge {
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(124,111,255,.18);
      color: var(--accent1);
      border-radius: 99px;
      padding: 3px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .doc-snippet {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 10px;
    }
    .doc-snippet mark {
      background: var(--mark-bg);
      color: var(--mark-text);
      border-radius: 3px;
      padding: 0 2px;
    }

    .score-bar-wrap {
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .score-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }

    /* Empty / loading states */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .state-box .icon { font-size: 2.5rem; margin-bottom: 14px; display: block; opacity: .5; }
    .state-box p { font-size: 0.9rem; line-height: 1.6; }

    /* Skeleton loader */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
    }
    .skel {
      background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-circle { width: 28px; height: 28px; border-radius: 50%; }
    .skel-line   { height: 12px; margin-bottom: 8px; }
    .skel-line.short { width: 40%; }
    .skel-line.medium { width: 65%; }
    .skel-line.long   { width: 90%; }
  </style>
</head>
<body>

  <div class="hero">
    <span class="hero-icon">◈</span>
    <h1>Busca Vetorial</h1>
    <p>TF-IDF &nbsp;·&nbsp; Similaridade do Cosseno &nbsp;·&nbsp; Modelo Vetorial</p>
  </div>

  <div class="search-card">
    <div class="collection-row">
      <span class="collection-label">Coleção</span>
      <div class="collection-select-wrap">
        <select id="col-select"><option value="">Carregando...</option></select>
      </div>
    </div>

    <div class="search-row">
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="query-input" placeholder="O que deseja buscar?" autocomplete="off" />
      </div>
      <button class="btn-search" id="search-btn">Buscar</button>
    </div>

    <div class="actions-row">
      <button class="btn-reindex" id="reindex-btn">↺ Reindexar coleção</button>
    </div>
  </div>

  <div class="results-area" id="results-area"></div>

<script>
  const colSelect   = document.getElementById('col-select');
  const queryInput  = document.getElementById('query-input');
  const searchBtn   = document.getElementById('search-btn');
  const reindexBtn  = document.getElementById('reindex-btn');
  const resultsArea = document.getElementById('results-area');

  // ── Helpers ──────────────────────────────────────────────
  const docName = f => f.replace(/\.txt$/i, '');

  function highlight(text, terms) {
    if (!terms || !terms.length) return text;
    const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
    return text.replace(new RegExp(pattern, 'gi'), m => `<mark>${m}</mark>`);
  }

  function rankClass(i) {
    return ['rank-1','rank-2','rank-3'][i] ?? 'rank-n';
  }

  // ── States ────────────────────────────────────────────────
  function showSkeleton() {
    resultsArea.innerHTML = [1,2,3].map(() => `
      <div class="skeleton-card">
        <div><div class="skel skel-circle"></div></div>
        <div>
          <div class="skel skel-line medium"></div>
          <div class="skel skel-line long"></div>
          <div class="skel skel-line short"></div>
        </div>
      </div>`).join('');
  }

  function showEmpty(msg, icon = '◎') {
    resultsArea.innerHTML = `
      <div class="state-box">
        <span class="icon">${icon}</span>
        <p>${msg}</p>
      </div>`;
  }

  function renderResults(data, rawQuery) {
    if (data.error)  return showEmpty(data.error, '⚠');
    if (data.info)   return showEmpty(data.info, '◎');
    if (!data.results.length) return showEmpty('Nenhum documento encontrado para essa busca.', '◎');

    const topScore = data.results[0].score;
    const terms    = data.terms || [];

    const meta = `
      <div class="results-meta">
        <span>${data.total} documento${data.total > 1 ? 's' : ''} encontrado${data.total > 1 ? 's' : ''}</span>
        <span class="dot"></span>
        <span>exibindo ${data.results.length}</span>
        ${data.time_ms != null ? `<span class="dot"></span><span>${data.time_ms} ms</span>` : ''}
      </div>`;

    const cards = data.results.map((r, i) => {
      const pct     = topScore > 0 ? Math.round((r.score / topScore) * 100) : 0;
      const snippet = r.snippet ? highlight(r.snippet, terms) : '';
      return `
        <div class="result-card" style="animation-delay:${i * 45}ms">
          <div class="rank-col">
            <span class="rank-num ${rankClass(i)}">${i + 1}</span>
          </div>
          <div class="doc-col">
            <div class="doc-header">
              <span class="doc-name">${docName(r.doc)}</span>
              <span class="score-badge">${r.score.toFixed(4)}</span>
            </div>
            ${snippet ? `<p class="doc-snippet">${snippet}</p>` : ''}
            <div class="score-bar-wrap">
              <div class="score-bar" style="width:${pct}%"></div>
            </div>
          </div>
        </div>`;
    }).join('');

    resultsArea.innerHTML = meta + cards;
  }

  // ── API calls ─────────────────────────────────────────────
  async function loadCollections() {
    const res  = await fetch('/api/collections');
    const list = await res.json();
    colSelect.innerHTML = '';
    if (!list.length) {
      colSelect.innerHTML = '<option value="">Nenhuma coleção encontrada</option>';
      return;
    }
    list.forEach(c => {
      const opt = document.createElement('option');
      opt.value       = c.path;
      opt.textContent = `${c.nome}  (${c.total} doc${c.total > 1 ? 's' : ''})`;
      colSelect.appendChild(opt);
    });
  }

  async function doSearch() {
    const query = queryInput.value.trim();
    const path  = colSelect.value;
    if (!query || !path) return;

    searchBtn.disabled = true;
    showSkeleton();

    try {
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, collection_path: path }),
      });
      renderResults(await res.json(), query);
    } catch {
      showEmpty('Erro ao conectar com a API.', '⚠');
    } finally {
      searchBtn.disabled = false;
    }
  }

  async function doReindex() {
    const path = colSelect.value;
    if (!path) return;
    reindexBtn.disabled = true;
    reindexBtn.textContent = 'Reindexando…';
    try {
      await fetch('/api/reindex', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collection_path: path }),
      });
      reindexBtn.textContent = '✓ Concluído';
      setTimeout(() => { reindexBtn.textContent = '↺ Reindexar coleção'; reindexBtn.disabled = false; }, 2000);
    } catch {
      reindexBtn.textContent = '↺ Reindexar coleção';
      reindexBtn.disabled = false;
    }
  }

  // ── Events ────────────────────────────────────────────────
  searchBtn.addEventListener('click', doSearch);
  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  reindexBtn.addEventListener('click', doReindex);

  // ── Init ──────────────────────────────────────────────────
  showEmpty('Digite uma consulta acima para começar.', '◈');
  loadCollections();
</script>
</body>
</html>
